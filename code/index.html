<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Buzzer Reaction XR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- Optionale Hilfskomponenten -->
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
  </head>
  <body>
    <a-scene
      xr-mode-ui="enabled: true"
      renderer="antialias: true"
      background="color: #ffffff"
    >
      <!-- Licht -->
      <a-entity light="type: ambient; intensity: 0.5"></a-entity>
      <a-entity
        light="type: directional; intensity: 0.8"
        position="0 3 -2"
      ></a-entity>


      <a-assets>
        <a-asset-item id="automat" src="./assets/Automat.gltf"></a-asset-item>
        <audio id="audioStart" src="./assets/start.mp3" preload="auto"></audio>
      </a-assets>

      
      <!-- Arcade-Automat -->
      <a-entity gltf-model="#automat" scale="1 1 1" position="-0.4 -1.35 -1" rotation="0 270 0"></a-entity>
      <a-entity id="arcade" position="0 0 -2">
        

        <!-- Bildschirm Container (alles Spiel läuft hier) -->
        <a-entity id="screenContainer" scale="1.75 1.75 1.75" position="0.35 2.5 0.36" rotation="-25 0 0">
          <!-- Bildschirm Text -->
          <a-text
            id="screenText"
            position="0 0.5 0"
            align="center"
            color="#ffffff"
            wrap-count="20"
            scale="0.15 0.15 0.15"
            value="BUZZER REACTION XR&#10; Druecke START"
          >
            </a-text>

          <!-- Start-Button -->
          <a-cylinder
            id="startButton"
            class="clickable"
            position="-0.3 -0.3 0.07"
            rotation="30 0 0"
            radius="0.08"
            height="0.06"
            color="#ff3333"
            event-set__enter="_event: mouseenter; color: #ff6666"
            event-set__leave="_event: mouseleave; color: #ff3333"
          >
          </a-cylinder>
          <a-text
            id="startLabel"
            color="#ffffff"
            value="START"
            align="center"
            position="-0.3 -0.2 0.02"
            scale="0.2 0.2 0.2"
          ></a-text>

          <!-- Schwierigkeits-Button -->
          <a-cylinder
            id="difficultyButton"
            class="clickable"
            position="0 -0.3 0.07"
            rotation="30 0 0"
            radius="0.08"
            height="0.06"
            color="#3366ff"
            event-set__enter="_event: mouseenter; color: #6690ff"
            event-set__leave="_event: mouseleave; color: #3366ff"
          >
          </a-cylinder>
          <a-text
            id="difficultyLabel"
            value="NORMAL"
            align="center"
            color="#ffffff"
            position="0 -0.2 0.02"
            scale="0.18 0.18 0.18"
          ></a-text>

          <!-- Reset Highscore -->
          <a-cylinder
            id="resetHighscore"
            class="clickable"
            position="0.3 -0.3 0.07"
            rotation="30 0 0"
            radius="0.08"
            height="0.06"
            color="#ffaa00"
            event-set__enter="_event: mouseenter; color: #ffcc55"
            event-set__leave="_event: mouseleave; color: #ffaa00"
          >
          </a-cylinder>
          <a-text
            id="resetLabel"
            value="RESET"
            align="center"
            position="0.3 -0.2 0.02"
            scale="0.18 0.18 0.18"
            color="#ffffff"
          ></a-text>

          <!-- HUD -->
          <a-text
            id="timerText"
            value="Zeit: 0.0"
            align="center"
            position="0 0.53 0"
            color="#00ff00"
            scale="0.2 0.2 0.2"
          ></a-text>
          <a-text
            id="scoreText"
            value="Score: 0"
            align="center"
            position="0 0.45 0"
            color="#ffffff"
            scale="0.2 0.2 0.2"
          ></a-text>
          <a-text
            id="highscoreText"
            value="Highscore: 0"
            align="center"
            position="0 0.15 0"
            color="#ffff00"
            scale="0.15 0.15 0.15"
          ></a-text>
          <a-text
            id="reactionText"
            value="Reaktion: -- ms"
            position="0 0.05 0"
            align="center"
            color="#00ea10"
            scale="0.15 0.15 0.15"
          ></a-text>

          <!-- Container für Buzzer -->
          <a-entity id="buzzerContainer"></a-entity>
        </a-entity>

      <!-- Sounds-->
      <a-sound
        id="sndStart"
        src="#audioStart"
        autoplay="false"
        volume="0.7"
      ></a-sound>

      <!-- Maus-/Gaze-Cursor -->
      <a-entity camera look-controls wasd-controls position="0.3 3 4">
        <a-entity
          cursor="fuse: false; rayOrigin: mouse"
          raycaster="objects: .clickable, .buzzer"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
          material="color: #000000; shader: flat"
        >
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      (() => {
        const GAME_DURATION = 30; // Sekunden
        const difficulties = [
          {
            name: "EASY",
            spawnDelayMin: 0.8,
            spawnDelayMax: 1,
            buzzerLifetime: 1.4,
          },
          {
            name: "NORMAL",
            spawnDelayMin: 0.6,
            spawnDelayMax: 0.8,
            buzzerLifetime: 1.0,
          },
          {
            name: "HARD",
            spawnDelayMin: 0.4,
            spawnDelayMax: 0.6,
            buzzerLifetime: 0.7,
          },
        ];

        let difficultyIndex = 1;
        let gameRunning = false;
        let timeLeft = GAME_DURATION;
        let score = 0;
        let highscore = 0;
        let bestReaction = null;

        let nextSpawnTime = 0;
        let currentBuzzer = null;
        let buzzerSpawnTime = 0;
        let buzzerTimeoutId = null;

        const buzzerContainer = document.getElementById("buzzerContainer");
        const timerText = document.getElementById("timerText");
        const scoreText = document.getElementById("scoreText");
        const highscoreText = document.getElementById("highscoreText");
        const reactionText = document.getElementById("reactionText");
        const screenText = document.getElementById("screenText");
        const difficultyLabel = document.getElementById("difficultyLabel");
        const startLabel = document.getElementById("startLabel");
        const resetLabel = document.getElementById("resetLabel");

        const startButton = document.getElementById("startButton");
        const difficultyButton = document.getElementById("difficultyButton");
        const resetHighscoreButton = document.getElementById("resetHighscore");

        // Highscore aus localStorage
        if (window.localStorage) {
          const saved = localStorage.getItem("buzzerXRHighscore");
          if (saved) {
            highscore = parseInt(saved, 10) || 0;
            highscoreText.setAttribute("value", "Highscore: " + highscore);
          }
        }

        function formatTime(t) {
          return "Zeit: " + t.toFixed(1);
        }

        function setDifficulty(index) {
          difficultyIndex = index;
          difficultyLabel.setAttribute(
            "value",
            difficulties[difficultyIndex].name
          );
        }

        function cycleDifficulty() {
          if (gameRunning) return;
          difficultyIndex = (difficultyIndex + 1) % difficulties.length;
          setDifficulty(difficultyIndex);
        }

        function resetHighscore() {
          if (window.localStorage) {
            localStorage.removeItem("buzzerXRHighscore");
          }
          highscore = 0;
          highscoreText.setAttribute("value", "Highscore: 0");
        }

        function updateHUD() {
          //Macht alles unsichtbar wenn das spiel läuft 
          screenText.setAttribute("visible", !gameRunning);
          highscoreText.setAttribute("visible", !gameRunning);
          reactionText.setAttribute("visible", !gameRunning);
          startButton.setAttribute("visible", !gameRunning);
          startLabel.setAttribute("visible", !gameRunning);
          resetHighscoreButton.setAttribute("visible", !gameRunning);
          resetLabel.setAttribute("visible", !gameRunning);
          difficultyButton.setAttribute("visible", !gameRunning);
          difficultyLabel.setAttribute("visible", !gameRunning);    

          // Timer und Score nur während des Spiels sichtbar
          timerText.setAttribute("visible", gameRunning);
          scoreText.setAttribute("visible", gameRunning);

          timerText.setAttribute("value", formatTime(timeLeft));
          scoreText.setAttribute("value", "Score: " + Math.round(score));
          highscoreText.setAttribute("value", "Highscore: " + highscore);
          if (bestReaction == null) {
            reactionText.setAttribute("value", "Reaktion: -- ms");
          } else {
            reactionText.setAttribute(
              "value",
              "Reaktion: " + Math.round(bestReaction) + " ms"
            );
          }
        }

        function removeCurrentBuzzer(missed = false) {
          if (!currentBuzzer) return;
          if (buzzerTimeoutId) {
            clearTimeout(buzzerTimeoutId);
            buzzerTimeoutId = null;
          }
          if (missed) {
            // kurzer Miss-Effekt
            currentBuzzer.setAttribute("material", "color: #ff8800");
            setTimeout(() => {
              if (currentBuzzer && currentBuzzer.parentNode) {
                currentBuzzer.parentNode.removeChild(currentBuzzer);
              }
              currentBuzzer = null;
            }, 150);
          } else {
            if (currentBuzzer.parentNode) {
              currentBuzzer.parentNode.removeChild(currentBuzzer);
            }
            currentBuzzer = null;
          }
        }

        function spawnBuzzer() {
          if (!gameRunning || currentBuzzer) return;

          const diff = difficulties[difficultyIndex];
          // Spawn Buzzer nur im Bildschirmbereich (relativ zur screenContainer)
          const x = (Math.random() - 0.5) * 0.65; // Faktor für Bildschirmbreite
          const y = (Math.random() - 0.5) * 0.38; // Faktor für Bildschirmhöhe
          const z = 0.01; // Just vor dem Bildschirm

          const buzzer = document.createElement("a-entity");
          buzzer.setAttribute("class", "buzzer clickable");
          buzzer.setAttribute("scale", "0.6 0.6 0.6"); 
          buzzer.setAttribute("position", x + " " + y + " " + z);
          buzzer.setAttribute("rotation", "90 0 0");
          buzzer.setAttribute(
            "geometry",
            "primitive: cylinder; radius: 0.08; height: 0.08"
          );
          buzzer.setAttribute("material", "color: #ff0000; shader: flat");
          /*buzzer.setAttribute(
            "animation__float",
            "property: position; dir: alternate; dur: 500; easing: easeInOutSine; loop: true; to: " +
              x +
              " " +
              (y + 0.03) +
              " " +
              z
          );
          /*buzzer.setAttribute(
            "animation__spin",
            "property: rotation; dur: 1000; easing: linear; loop: true; to: 0 360 0"
          );
          */

          buzzer.addEventListener("click", () => {
            if (!gameRunning || buzzer !== currentBuzzer) return;            
            const rt = performance.now() - buzzerSpawnTime;
            score += Math.max(10, 1500 - rt);
            bestReaction =
              bestReaction == null ? rt : Math.min(bestReaction, rt);
            buzzer.setAttribute("material", "color: #00ff00");
            buzzer.setAttribute(
              "animation__hit",
              "property: scale; from: 1 1 1; to: 1.4 1.4 1.4; dur: 180"
            );
            setTimeout(() => removeCurrentBuzzer(false), 180);
            updateHUD();
            scheduleNextSpawn();
          });

          buzzerContainer.appendChild(buzzer);
          currentBuzzer = buzzer;
          buzzerSpawnTime = performance.now();

          // Timeout für „nicht getroffen“
          buzzerTimeoutId = setTimeout(() => {
            if (!gameRunning || !currentBuzzer || currentBuzzer !== buzzer)
              return;
            removeCurrentBuzzer(true);
            scheduleNextSpawn();
          }, diff.buzzerLifetime * 1000);
        }

        function scheduleNextSpawn() {
          const diff = difficulties[difficultyIndex];
          const delay =
            diff.spawnDelayMin +
            Math.random() * (diff.spawnDelayMax - diff.spawnDelayMin);
          nextSpawnTime = performance.now() + delay * 1000;
        }

        function startGame() {
          if (gameRunning) return;

          gameRunning = true;

          timeLeft = GAME_DURATION;
          score = 0;
          bestReaction = null;
          document.getElementById("audioStart").play();
          updateHUD();
          scheduleNextSpawn();
        }

        function endGame() {
          gameRunning = false;
          removeCurrentBuzzer(false);
          if (score > highscore) {
            highscore = Math.round(score);
            if (window.localStorage) {
              localStorage.setItem("buzzerXRHighscore", highscore);
            }
          }
          updateHUD();
          screenText.setAttribute(
            "value",
            "GAME OVER\nScore: " +
              Math.round(score) +
              "\nBeste Reaktion: " +
              (bestReaction == null ? "--" : Math.round(bestReaction) + " ms") +
              "\nHighscore: " +
              highscore +
              "\nDruecke START fuer neue Runde"
          );
        }

        // Hauptloop
        function tick() {
          const now = performance.now();

          if (gameRunning) {
            document.getElementById("scoreText").style.visibility = 'hidden';
            

            const dt = 1 / 60;
            timeLeft -= dt;
            if (timeLeft <= 0) {
              timeLeft = 0;
              endGame();
            }
            updateHUD();

            if (!currentBuzzer && now >= nextSpawnTime) {
              spawnBuzzer();
            }

          }



          requestAnimationFrame(tick);
        }

        // Button-Events
        startButton.addEventListener("click", () => startGame());
        difficultyButton.addEventListener("click", () => cycleDifficulty());
        resetHighscoreButton.addEventListener("click", () => resetHighscore());

        // Initial
        setDifficulty(difficultyIndex);
        updateHUD();
        tick();
      })();
    </script>
  </body>
</html>
