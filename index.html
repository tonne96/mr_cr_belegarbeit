<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Buzzer Reaction XR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- Optionale Hilfskomponenten -->
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>

  <body>
    <a-scene
      xr-mode-ui="enabled: true"
      renderer="antialias: true; colorManagement: true"
      background="color: #ffffff"
      ar-hit-test="object: #automatModel"
    >
      <!-- Licht -->
      <a-entity light="type: ambient; intensity: 0.5"></a-entity>
      <a-entity
        light="type: directional; intensity: 0.8"
        position="0 3 -2"
      ></a-entity>

      <a-assets>
        <a-asset-item id="automat" src="./assets/Automat.gltf"></a-asset-item>
        <audio id="audioStart" src="./assets/start.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Arcade-Automat -->
      <a-entity
        id="automatModel"
        gltf-model="#automat"
        scale="1 1 1"
        position="-0.4 -1.35 -1"
        rotation="0 270 0"
      ></a-entity>

      <a-entity id="arcade" position="0 0 -2">
        <!-- Bildschirm Container (alles Spiel läuft hier) -->
        <a-entity
          id="screenContainer"
          scale="1.75 1.75 1.75"
          position="0.35 2.5 0.36"
          rotation="-25 0 0"
        >
          <!-- Bildschirm Text -->
          <a-text
            id="screenText"
            position="0 0.5 0"
            align="center"
            color="#ffffff"
            wrap-count="20"
            scale="0.15 0.15 0.15"
            value="BUZZER REACTION XR&#10; Druecke START"
          ></a-text>

          <!-- Start-Button -->
          <a-cylinder
            id="startButton"
            class="clickable"
            position="-0.3 -0.3 0.07"
            rotation="30 0 0"
            radius="0.08"
            height="0.06"
            color="#ff3333"
            event-set__enter="_event: mouseenter; color: #ff6666"
            event-set__leave="_event: mouseleave; color: #ff3333"
          ></a-cylinder>
          <a-text
            id="startLabel"
            color="#ffffff"
            value="START"
            align="center"
            position="-0.3 -0.2 0.02"
            scale="0.2 0.2 0.2"
          ></a-text>

          <!-- Schwierigkeits-Button -->
          <a-cylinder
            id="difficultyButton"
            class="clickable"
            position="0 -0.3 0.07"
            rotation="30 0 0"
            radius="0.08"
            height="0.06"
            color="#3366ff"
            event-set__enter="_event: mouseenter; color: #6690ff"
            event-set__leave="_event: mouseleave; color: #3366ff"
          ></a-cylinder>
          <a-text
            id="difficultyLabel"
            value="NORMAL"
            align="center"
            color="#ffffff"
            position="0 -0.2 0.02"
            scale="0.18 0.18 0.18"
          ></a-text>

          <!-- Reset Highscore -->
          <a-cylinder
            id="resetHighscore"
            class="clickable"
            position="0.3 -0.3 0.07"
            rotation="30 0 0"
            radius="0.08"
            height="0.06"
            color="#ffaa00"
            event-set__enter="_event: mouseenter; color: #ffcc55"
            event-set__leave="_event: mouseleave; color: #ffaa00"
          ></a-cylinder>
          <a-text
            id="resetLabel"
            value="RESET"
            align="center"
            position="0.3 -0.2 0.02"
            scale="0.18 0.18 0.18"
            color="#ffffff"
          ></a-text>

          <!-- HUD -->
          <a-text
            id="timerText"
            value="Zeit: 0.0"
            align="center"
            position="0 0.53 0"
            color="#00ff00"
            scale="0.2 0.2 0.2"
          ></a-text>
          <a-text
            id="scoreText"
            value="Score: 0"
            align="center"
            position="0 0.45 0"
            color="#ffffff"
            scale="0.2 0.2 0.2"
          ></a-text>
          <a-text
            id="highscoreText"
            value="Highscore: 0"
            align="center"
            position="0 0.15 0"
            color="#ffff00"
            scale="0.15 0.15 0.15"
          ></a-text>
          <a-text
            id="reactionText"
            value="Reaktion: -- ms"
            position="0 0.05 0"
            align="center"
            color="#00ea10"
            scale="0.15 0.15 0.15"
          ></a-text>

          <!-- Container für Buzzer -->
          <a-entity id="buzzerContainer"></a-entity>
        </a-entity>
      </a-entity>

      <!-- Sounds-->
      <a-sound
        id="sndStart"
        src="#audioStart"
        autoplay="false"
        volume="0.7"
      ></a-sound>

      <!-- =========================
           PLAYER RIG (Desktop + VR)
           ========================= -->
      <a-entity id="rig" position="0.3 3 4" rotation="0 0 0">
        <!-- Desktop Kamera + WASD (Cursor-Ring entfernt) -->
        <a-entity
          id="camera"
          camera
          look-controls
          wasd-controls
          raycaster="objects: .clickable, .buzzer; far: 20"
          cursor="rayOrigin: mouse"
          position="0 0 0"
        ></a-entity>

        <!-- VR Controller (sichtbar nur in VR) -->
        <a-entity
          id="leftHand"
          visible="false"
          laser-controls="hand: left"
          raycaster="objects: .clickable, .buzzer; far: 20"
          line="color: #00ff00"
          vr-click
          vr-joystick-locomotion="speed: 2.0; deadzone: 0.18"
        ></a-entity>

        <a-entity
          id="rightHand"
          visible="false"
          laser-controls="hand: right"
          raycaster="objects: .clickable, .buzzer; far: 20"
          line="color: #00ff00"
          vr-click
          vr-vertical-move="speed: 1.5; deadzone: 0.18"
        ></a-entity>
      </a-entity>

      <script>
        // =========================================================
        // AR Hit-Testing Komponente (Hit-Test für Bodenplatzierung)
        // =========================================================
        AFRAME.registerComponent("ar-hit-test", {
          schema: {
            object: { type: "selector" }, // Das Objekt das platziert werden soll
          },
          init: function () {
            const scene = this.el.sceneEl;
            const canvas = scene.canvas;
            const object = this.data.object;

            if (!object) return;

            canvas.addEventListener("click", async () => {
              if (!scene.is("ar-mode")) return;

              const session = scene.xrSession;
              if (!session || !session.requestHitTestSource) return;

              try {
                // Hit-Test am Mittelpunkt des Bildschirms
                const hitTestSource = await session.requestHitTestSource({
                  space:
                    scene.xrSession.inputSources[0]?.gripSpace ||
                    scene.xrSession.inputSources[0]?.targetRaySpace,
                });

                const frame = scene.xrFrame;
                if (!frame) return;

                const results = frame.getHitTestResults(hitTestSource);
                if (results.length > 0) {
                  const hit = results[0];
                  const pose = hit.getPose(
                    frame.session.inputSources[0]?.gripSpace ||
                      frame.referenceSpace,
                  );

                  if (pose) {
                    // Objekt an Hit-Test Position platzieren
                    const matrix = pose.transform.matrix;
                    const position = [matrix[12], matrix[13], matrix[14]];
                    object.setAttribute("position", position.join(" "));
                    object.setAttribute("visible", "true");
                  }
                }
              } catch (e) {
                console.log(
                  "Hit-Test nicht verfügbar, verwende Standard-Platzierung",
                );
              }
            });
          },
        });

        // =========================================================
        // A-Frame Game Loop (VR-sicher)
        // =========================================================
        AFRAME.registerComponent("buzzer-game-loop", {
          tick: function (time, timeDelta) {
            if (window.__buzzerTick) window.__buzzerTick(timeDelta / 1000);
          },
        });

        // =========================================================
        // VR Trigger => "click" auf Raycaster-Ziel
        // =========================================================
        AFRAME.registerComponent("vr-click", {
          init: function () {
            const fire = () => {
              const ray = this.el.components.raycaster;
              if (!ray) return;
              const hits = ray.intersections;
              if (!hits || hits.length === 0) return;

              const targetEl = hits[0].object && hits[0].object.el;
              if (targetEl) targetEl.emit("click");
            };

            this.el.addEventListener("triggerdown", fire);
            this.el.addEventListener("gripdown", fire);
            this.el.addEventListener("abuttondown", fire);
            this.el.addEventListener("xbuttondown", fire);
          },
        });

        // =========================================================
        // VR Joystick Locomotion
        // =========================================================
        AFRAME.registerComponent("vr-joystick-locomotion", {
          schema: {
            speed: { type: "number", default: 2.0 },
            deadzone: { type: "number", default: 0.18 },
          },
          tick: function (time, timeDelta) {
            const scene = this.el.sceneEl;
            if (!scene || !scene.is("vr-mode")) return;

            const rig = document.getElementById("rig");
            const cam = document.getElementById("camera");
            if (!rig || !cam) return;

            const tracked = this.el.components["tracked-controls"];
            if (!tracked || !tracked.controller) return;

            const gp = tracked.controller.gamepad;
            if (!gp || !gp.axes) return;

            const axes = gp.axes;

            // Häufig: axes[2]/[3] sonst fallback axes[0]/[1]
            let axX = axes.length >= 4 ? axes[2] : axes[0];
            let axY = axes.length >= 4 ? axes[3] : axes[1];

            // Fallback wenn [2,3] leer sind
            if (Math.abs(axX) < 0.001 && Math.abs(axY) < 0.001) {
              axX = axes[0] ?? 0;
              axY = axes[1] ?? 0;
            }

            // Deadzone
            if (Math.abs(axX) < this.data.deadzone) axX = 0;
            if (Math.abs(axY) < this.data.deadzone) axY = 0;
            if (axX === 0 && axY === 0) return;

            const dt = timeDelta / 1000;

            // Blickrichtung (Yaw) der Kamera
            const yaw = (cam.getAttribute("rotation").y * Math.PI) / 180;

            // Vor/Zurück
            const forward = axY * this.data.speed * dt;

            // Links/Rechts
            const strafe = axX * this.data.speed * dt;

            const dx = Math.sin(yaw) * forward + Math.cos(yaw) * strafe;
            const dz = Math.cos(yaw) * forward - Math.sin(yaw) * strafe;

            const pos = rig.getAttribute("position");
            rig.setAttribute("position", {
              x: pos.x + dx,
              y: pos.y,
              z: pos.z + dz,
            });
          },
        });

        // =========================================================
        // VR Vertical Movement (rechter Stick hoch/runter)
        // =========================================================
        AFRAME.registerComponent("vr-vertical-move", {
          schema: {
            speed: { type: "number", default: 1.2 },
            deadzone: { type: "number", default: 0.18 },
          },
          tick: function (time, timeDelta) {
            const scene = this.el.sceneEl;
            if (!scene || !scene.is("vr-mode")) return;

            const rig = document.getElementById("rig");
            if (!rig) return;

            const tracked = this.el.components["tracked-controls"];
            if (!tracked || !tracked.controller) return;

            const gp = tracked.controller.gamepad;
            if (!gp || !gp.axes) return;

            const axes = gp.axes;

            // rechter Stick Y: häufig axes[3], fallback axes[1]
            let vertical = axes.length >= 4 ? axes[3] : axes[1];
            if (Math.abs(vertical) < this.data.deadzone) return;

            const dt = timeDelta / 1000;

            // Stick hoch -> hoch (falls invertiert: Vorzeichen ändern)
            const dy = -vertical * this.data.speed * dt;

            const pos = rig.getAttribute("position");
            rig.setAttribute("position", { x: pos.x, y: pos.y + dy, z: pos.z });
          },
        });

        // =========================================================
        // Helper: Rig so verschieben, dass HMD-Kamera exakt auf Ziel landet
        // =========================================================
        function moveRigSoCameraHitsWorldPos(targetWorldPos, targetYawDeg) {
          const rig = document.getElementById("rig");
          const cam = document.getElementById("camera");
          if (!rig || !cam) return;

          const camWorld = new THREE.Vector3();
          cam.object3D.getWorldPosition(camWorld);

          const delta = targetWorldPos.clone().sub(camWorld);

          const rigPos = rig.getAttribute("position");
          rig.setAttribute("position", {
            x: rigPos.x + delta.x,
            y: rigPos.y + delta.y,
            z: rigPos.z + delta.z,
          });

          rig.setAttribute("rotation", { x: 0, y: targetYawDeg, z: 0 });
        }

        // =========================================================
        // Spawn vor Automat + Blick auf Automat
        // =========================================================
        function spawnInFrontOfAutomat() {
          const autom = document.getElementById("automatModel");
          if (!autom) return;

          const automPos = new THREE.Vector3();
          autom.object3D.getWorldPosition(automPos);

          // Forward-Richtung des Automaten (A-Frame forward = -Z)
          const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(
            autom.object3D.quaternion,
          );

          const distance = 1.2;
          const targetPos = automPos
            .clone()
            .add(forward.clone().multiplyScalar(distance));

          const automRot = autom.getAttribute("rotation");
          const targetYaw = (automRot ? automRot.y : 0) + 180;

          moveRigSoCameraHitsWorldPos(targetPos, targetYaw);
        }

        // =========================================================
        // VR/AR Enter/Exit: Controller sichtbar + Spawn nach XR init
        // + Beim Exit zurück zum "vor dem Automaten" Punkt
        // =========================================================
        (function setupXr() {
          const scene = document.querySelector("a-scene");
          const left = document.getElementById("leftHand");
          const right = document.getElementById("rightHand");
          const rig = document.getElementById("rig");
          const cam = document.getElementById("camera");

          if (!scene || !rig) return;

          // ✅ Hier speichern wir die "Startposition vor dem Automaten"
          let xrStartRigPos = null;
          let xrStartRigRot = null;
          let isARMode = false;

          // Game loop immer aktiv (funktioniert Desktop + VR + AR)
          scene.setAttribute("buzzer-game-loop", "");

          scene.addEventListener("enter-vr", () => {
            isARMode = false;
            left && left.setAttribute("visible", "true");
            right && right.setAttribute("visible", "true");

            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                // Spawn vor Automat
                spawnInFrontOfAutomat();

                // ✅ DIREKT DANACH speichern wir die Position/Rotation
                setTimeout(() => {
                  xrStartRigPos = { ...rig.getAttribute("position") };
                  xrStartRigRot = { ...rig.getAttribute("rotation") };
                }, 0);
              });
            });
          });

          scene.addEventListener("enter-ar", () => {
            isARMode = true;
            left && left.setAttribute("visible", "false");
            right && right.setAttribute("visible", "false");

            // ✅ In AR-Modus: Automat vor der Kamera platzieren
            const automat = document.getElementById("automatModel");
            if (automat) {
              // Automat ca. 1m vor Kamera platzieren
              automat.setAttribute("position", "0 0 -1.5");
              automat.setAttribute("visible", "true");
            }

            // ✅ Camera auf Standard zurücksetzen
            if (cam) {
              cam.setAttribute("rotation", "0 0 0");
              cam.setAttribute("position", "0 0 0");
            }

            // ✅ AR-Startposition speichern
            setTimeout(() => {
              xrStartRigPos = { ...rig.getAttribute("position") };
              xrStartRigRot = { ...rig.getAttribute("rotation") };
            }, 100);
          });

          scene.addEventListener("exit-vr", () => {
            left && left.setAttribute("visible", "false");
            right && right.setAttribute("visible", "false");

            // ✅ Zurück zum Startpunkt (vor Automat)
            if (xrStartRigPos && xrStartRigRot) {
              rig.setAttribute("position", xrStartRigPos);
              rig.setAttribute("rotation", xrStartRigRot);
            }

            // Optional: Blick stabilisieren nach VR Exit
            if (cam && cam.components && cam.components["look-controls"]) {
              const lc = cam.components["look-controls"];
              if (typeof lc.resetOrientation === "function")
                lc.resetOrientation();
              cam.setAttribute("rotation", "0 0 0");
            }
          });

          scene.addEventListener("exit-ar", () => {
            isARMode = false;

            // ✅ Automat wieder ausblenden
            const automat = document.getElementById("automatModel");
            if (automat) {
              automat.setAttribute("position", "-0.4 -1.35 -1");
              automat.setAttribute("visible", "false");
            }

            // ✅ Zurück zum AR-Startpunkt
            if (xrStartRigPos && xrStartRigRot) {
              rig.setAttribute("position", xrStartRigPos);
              rig.setAttribute("rotation", xrStartRigRot);
            }

            if (cam) {
              cam.setAttribute("rotation", "0 0 0");
            }
          });
        })();

        // =========================================================
        // DEIN GAME CODE (Tick umgebaut auf dt-Input, VR-sicher)
        // =========================================================
        (() => {
          const GAME_DURATION = 30; // Sekunden
          const difficulties = [
            {
              name: "EASY",
              spawnDelayMin: 0.8,
              spawnDelayMax: 1,
              buzzerLifetime: 1.4,
            },
            {
              name: "NORMAL",
              spawnDelayMin: 0.6,
              spawnDelayMax: 0.8,
              buzzerLifetime: 1.0,
            },
            {
              name: "HARD",
              spawnDelayMin: 0.4,
              spawnDelayMax: 0.6,
              buzzerLifetime: 0.7,
            },
          ];

          let difficultyIndex = 1;
          let gameRunning = false;
          let timeLeft = GAME_DURATION;
          let score = 0;
          let highscore = 0;
          let bestReaction = null;

          let nextSpawnTime = 0;
          let currentBuzzer = null;
          let buzzerSpawnTime = 0;
          let buzzerTimeoutId = null;

          const buzzerContainer = document.getElementById("buzzerContainer");
          const timerText = document.getElementById("timerText");
          const scoreText = document.getElementById("scoreText");
          const highscoreText = document.getElementById("highscoreText");
          const reactionText = document.getElementById("reactionText");
          const screenText = document.getElementById("screenText");
          const difficultyLabel = document.getElementById("difficultyLabel");

          const startButton = document.getElementById("startButton");
          const difficultyButton = document.getElementById("difficultyButton");
          const resetHighscoreButton =
            document.getElementById("resetHighscore");

          if (window.localStorage) {
            const saved = localStorage.getItem("buzzerXRHighscore");
            if (saved) {
              highscore = parseInt(saved, 10) || 0;
              highscoreText.setAttribute("value", "Highscore: " + highscore);
            }
          }

          function formatTime(t) {
            return "Zeit: " + t.toFixed(1);
          }

          function setDifficulty(index) {
            difficultyIndex = index;
            difficultyLabel.setAttribute(
              "value",
              difficulties[difficultyIndex].name,
            );
          }

          function cycleDifficulty() {
            if (gameRunning) return;
            difficultyIndex = (difficultyIndex + 1) % difficulties.length;
            setDifficulty(difficultyIndex);
          }

          function resetHighscore() {
            if (window.localStorage)
              localStorage.removeItem("buzzerXRHighscore");
            highscore = 0;
            highscoreText.setAttribute("value", "Highscore: 0");
          }

          function updateHUD() {
            screenText.setAttribute("visible", !gameRunning);
            highscoreText.setAttribute("visible", !gameRunning);
            reactionText.setAttribute("visible", !gameRunning);
            startButton.setAttribute("visible", !gameRunning);
            document
              .getElementById("startLabel")
              .setAttribute("visible", !gameRunning);
            resetHighscoreButton.setAttribute("visible", !gameRunning);
            document
              .getElementById("resetLabel")
              .setAttribute("visible", !gameRunning);
            difficultyButton.setAttribute("visible", !gameRunning);
            document
              .getElementById("difficultyLabel")
              .setAttribute("visible", !gameRunning);

            timerText.setAttribute("visible", gameRunning);
            scoreText.setAttribute("visible", gameRunning);

            timerText.setAttribute("value", formatTime(timeLeft));
            scoreText.setAttribute("value", "Score: " + Math.round(score));
            highscoreText.setAttribute("value", "Highscore: " + highscore);

            if (bestReaction == null) {
              reactionText.setAttribute("value", "Reaktion: -- ms");
            } else {
              reactionText.setAttribute(
                "value",
                "Reaktion: " + Math.round(bestReaction) + " ms",
              );
            }
          }

          function removeCurrentBuzzer(missed = false) {
            if (!currentBuzzer) return;
            if (buzzerTimeoutId) {
              clearTimeout(buzzerTimeoutId);
              buzzerTimeoutId = null;
            }
            if (missed) {
              currentBuzzer.setAttribute("material", "color: #ff8800");
              setTimeout(() => {
                if (currentBuzzer && currentBuzzer.parentNode)
                  currentBuzzer.parentNode.removeChild(currentBuzzer);
                currentBuzzer = null;
              }, 150);
            } else {
              if (currentBuzzer.parentNode)
                currentBuzzer.parentNode.removeChild(currentBuzzer);
              currentBuzzer = null;
            }
          }

          function spawnBuzzer() {
            if (!gameRunning || currentBuzzer) return;

            const diff = difficulties[difficultyIndex];
            const x = (Math.random() - 0.5) * 0.65;
            const y = (Math.random() - 0.5) * 0.38;
            const z = 0.01;

            const buzzer = document.createElement("a-entity");
            buzzer.setAttribute("class", "buzzer clickable");
            buzzer.setAttribute("scale", "0.6 0.6 0.6");
            buzzer.setAttribute("position", x + " " + y + " " + z);
            buzzer.setAttribute("rotation", "90 0 0");
            buzzer.setAttribute(
              "geometry",
              "primitive: cylinder; radius: 0.08; height: 0.08",
            );
            buzzer.setAttribute("material", "color: #ff0000; shader: flat");

            buzzer.addEventListener("click", () => {
              if (!gameRunning || buzzer !== currentBuzzer) return;
              const rt = performance.now() - buzzerSpawnTime;
              score += Math.max(10, 1500 - rt);
              bestReaction =
                bestReaction == null ? rt : Math.min(bestReaction, rt);
              buzzer.setAttribute("material", "color: #00ff00");
              buzzer.setAttribute(
                "animation__hit",
                "property: scale; from: 1 1 1; to: 1.4 1.4 1.4; dur: 180",
              );
              setTimeout(() => removeCurrentBuzzer(false), 180);
              updateHUD();
              scheduleNextSpawn();
            });

            buzzerContainer.appendChild(buzzer);
            currentBuzzer = buzzer;
            buzzerSpawnTime = performance.now();

            buzzerTimeoutId = setTimeout(() => {
              if (!gameRunning || !currentBuzzer || currentBuzzer !== buzzer)
                return;
              removeCurrentBuzzer(true);
              scheduleNextSpawn();
            }, diff.buzzerLifetime * 1000);
          }

          function scheduleNextSpawn() {
            const diff = difficulties[difficultyIndex];
            const delay =
              diff.spawnDelayMin +
              Math.random() * (diff.spawnDelayMax - diff.spawnDelayMin);
            nextSpawnTime = performance.now() + delay * 1000;
          }

          function startGame() {
            if (gameRunning) return;
            gameRunning = true;
            timeLeft = GAME_DURATION;
            score = 0;
            bestReaction = null;

            document.getElementById("audioStart").play();
            updateHUD();
            scheduleNextSpawn();
          }

          function endGame() {
            gameRunning = false;
            removeCurrentBuzzer(false);
            if (score > highscore) {
              highscore = Math.round(score);
              if (window.localStorage)
                localStorage.setItem("buzzerXRHighscore", highscore);
            }
            updateHUD();
            screenText.setAttribute(
              "value",
              "GAME OVER\nScore: " +
                Math.round(score) +
                "\nBeste Reaktion: " +
                (bestReaction == null
                  ? "--"
                  : Math.round(bestReaction) + " ms") +
                "\nHighscore: " +
                highscore +
                "\nDruecke START fuer neue Runde",
            );
          }

          function tick(dt) {
            const now = performance.now();
            if (gameRunning) {
              timeLeft -= dt;
              if (timeLeft <= 0) {
                timeLeft = 0;
                endGame();
              }
              updateHUD();
              if (!currentBuzzer && now >= nextSpawnTime) spawnBuzzer();
            }
          }

          window.__buzzerTick = tick;

          startButton.addEventListener("click", () => startGame());
          difficultyButton.addEventListener("click", () => cycleDifficulty());
          resetHighscoreButton.addEventListener("click", () =>
            resetHighscore(),
          );

          setDifficulty(difficultyIndex);
          updateHUD();
        })();
      </script>
    </a-scene>
