<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Buzzer Reaction XR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <!-- Optionale Hilfskomponenten -->
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .xr-button {
        position: fixed;
        top: 20px;
        background-color: #1f7e6f;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        z-index: 100;
        display: none;
      }
      .xr-button:hover {
        background-color: #2a9a85;
      }
      .xr-button.available {
        display: block;
      }
      #vrButton {
        right: 280px;
      }
      #arButton {
        right: 20px;
      }
    </style>
  </head>

  <body>
    <button id="vrButton" class="xr-button">🥽 VR starten</button>
    <button id="arButton" class="xr-button">📱 AR starten</button>
    <a-scene
      disable-xr-resize
      xr-mode-ui="enabled: true"
      renderer="antialias: true; colorManagement: true; alpha: true; transparent: true"
    >
      <!-- Licht -->
      <a-entity light="type: ambient; intensity: 0.5"></a-entity>
      <a-entity
        light="type: directional; intensity: 0.8"
        position="0 3 -2"
      ></a-entity>

      <a-assets>
        <a-asset-item id="automat" src="./assets/Automat.gltf"></a-asset-item>
        <audio id="audioStart" src="./assets/start.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Arcade-Automat -->
      <a-entity
        id="automatModel"
        gltf-model="#automat"
        scale="1 1 1"
        position="-0.4 -1.35 -1"
        rotation="0 270 0"
      ></a-entity>

      <a-entity id="arcade" position="0 0 -2">
        <!-- Spiel Container skaliert um auf Spielautomat zu passen -->
        <a-entity
          id="screenContainer"
          scale="1.75 1.75 1.75"
          position="0.35 2.5 0.36"
          rotation="-25 0 0"
        >
          <a-text
            id="screenText"
            position="0 0.5 0"
            align="center"
            color="#ffffff"
            wrap-count="20"
            scale="0.15 0.15 0.15"
            value="BUZZER REACTION XR&#10; Druecke START"
          ></a-text>

          <a-cylinder
            id="startButton"
            class="clickable"
            position="-0.3 -0.3 0.07"
            rotation="30 0 0"
            radius="0.08"
            height="0.06"
            color="#ff3333"
            event-set__enter="_event: mouseenter; color: #ff6666"
            event-set__leave="_event: mouseleave; color: #ff3333"
          ></a-cylinder>
          <a-text
            id="startLabel"
            color="#ffffff"
            value="START"
            align="center"
            position="-0.3 -0.2 0.02"
            scale="0.2 0.2 0.2"
          ></a-text>

          <a-cylinder
            id="difficultyButton"
            class="clickable"
            position="0 -0.3 0.07"
            rotation="30 0 0"
            radius="0.08"
            height="0.06"
            color="#3366ff"
            event-set__enter="_event: mouseenter; color: #6690ff"
            event-set__leave="_event: mouseleave; color: #3366ff"
          ></a-cylinder>
          <a-text
            id="difficultyLabel"
            value="NORMAL"
            align="center"
            color="#ffffff"
            position="0 -0.2 0.02"
            scale="0.18 0.18 0.18"
          ></a-text>

          <a-cylinder
            id="resetHighscore"
            class="clickable"
            position="0.3 -0.3 0.07"
            rotation="30 0 0"
            radius="0.08"
            height="0.06"
            color="#ffaa00"
            event-set__enter="_event: mouseenter; color: #ffcc55"
            event-set__leave="_event: mouseleave; color: #ffaa00"
          ></a-cylinder>
          <a-text
            id="resetLabel"
            value="RESET"
            align="center"
            position="0.3 -0.2 0.02"
            scale="0.18 0.18 0.18"
            color="#ffffff"
          ></a-text>

          <!-- Anzeige -->
          <a-text
            id="timerText"
            value="Zeit: 0.0"
            align="center"
            position="0 0.53 0"
            color="#00ff00"
            scale="0.2 0.2 0.2"
          ></a-text>
          <a-text
            id="scoreText"
            value="Score: 0"
            align="center"
            position="0 0.45 0"
            color="#ffffff"
            scale="0.2 0.2 0.2"
          ></a-text>
          <a-text
            id="highscoreText"
            value="Highscore: 0"
            align="center"
            position="0 0.15 0"
            color="#ffff00"
            scale="0.15 0.15 0.15"
          ></a-text>
          <a-text
            id="reactionText"
            value="Reaktion: -- ms"
            position="0 0.05 0"
            align="center"
            color="#00ea10"
            scale="0.15 0.15 0.15"
          ></a-text>

          <a-entity id="buzzerContainer"></a-entity>
        </a-entity>
      </a-entity>

      <!-- Musik https://www.youtube.com/watch?v=oTn-14AHiEU&list=PLPEwKpHq_H2CUb2hmglb7-dRS5X2tXmnV-->
      <a-sound
        id="sndStart"
        src="#audioStart"
        autoplay="false"
        volume="0.7"
      ></a-sound>

      <!-- =========================
           PLAYER RIG (Desktop + VR)
           ========================= -->
      <a-entity id="rig" position="0.3 3 4" rotation="0 0 0">
        <!-- Desktop Kamera + WASD (Cursor-Ring entfernt) -->
        <a-entity
          id="camera"
          camera
          look-controls
          wasd-controls
          raycaster="objects: .clickable, .buzzer; far: 20"
          cursor="rayOrigin: mouse"
          position="0 0 0"
        ></a-entity>

        <!-- VR Controller (sichtbar nur in VR) -->
        <a-entity
          id="leftHand"
          visible="false"
          laser-controls="hand: left"
          raycaster="objects: .clickable, .buzzer; far: 20"
          line="color: #00ff00"
          vr-click
          vr-joystick-locomotion="speed: 2.0; deadzone: 0.18"
        ></a-entity>

        <a-entity
          id="rightHand"
          visible="false"
          laser-controls="hand: right"
          raycaster="objects: .clickable, .buzzer; far: 20"
          line="color: #00ff00"
          vr-click
          vr-vertical-move="speed: 1.5; deadzone: 0.18"
        ></a-entity>
      </a-entity>

      <script>
        /**
         * Verhindert Canvas-Resize während XR initialisiert
         * Blockiert die A-Frame Resize-Funktion temporär um den Fehler zu vermeiden
         */
        AFRAME.registerComponent("disable-xr-resize", {
          init: function () {
            const scene = this.el;
            let isXRLoading = false;

            const originalResize = scene.resize.bind(scene);
            scene.resize = function () {
              if (isXRLoading) return; // Blockiere Resize während XR lädt
              return originalResize();
            };

            // XR ist beim Start
            scene.addEventListener("enter-vr", () => {
              isXRLoading = true;
            });
            scene.addEventListener("enter-ar", () => {
              isXRLoading = true;
            });

            // XR ist fertig oder beendet
            setTimeout(() => {
              scene.addEventListener("exit-vr", () => {
                isXRLoading = false;
              });
              scene.addEventListener("exit-ar", () => {
                isXRLoading = false;
              });
            }, 100);
          },
        });

        /**
         * Game Loop Komponente
         * Diese Komponente wird jeden Frame aufgerufen und leitet die Zeit an
         * die Game-Logik weiter. So wird sichergestellt, dass das Spiel in VR/AR läuft.
         */
        AFRAME.registerComponent("buzzer-game-loop", {
          tick: function (time, timeDelta) {
            if (window.__buzzerTick) {
              window.__buzzerTick(timeDelta / 1000);
            }
          },
        });

        /**
         * VR Controller Click Komponente
         * Erkennt Controller-Button-Presses und wandelt sie in Click-Events um.
         * Das ermöglicht es, interaktive Objekte mit VR-Controllern anzuklicken.
         */
        AFRAME.registerComponent("vr-click", {
          init: function () {
            const fireClick = () => {
              const raycaster = this.el.components.raycaster;
              if (!raycaster) return;

              const hits = raycaster.intersections;
              if (!hits || hits.length === 0) return;

              const clickedElement = hits[0].object?.el;
              if (clickedElement) {
                clickedElement.emit("click");
              }
            };

            // Verschiedene Controller-Tasten als Click interpretieren
            this.el.addEventListener("triggerdown", fireClick);
            this.el.addEventListener("gripdown", fireClick);
            this.el.addEventListener("abuttondown", fireClick);
            this.el.addEventListener("xbuttondown", fireClick);
          },
        });

        /**
         * VR Bewegungs-Komponente (Joystick)
         * Liest den linken Controller-Joystick aus und bewegt den Spieler
         * in die Richtung, in die er schaut (relative Bewegung).
         */
        AFRAME.registerComponent("vr-joystick-locomotion", {
          schema: {
            speed: { type: "number", default: 2.0 },
            deadzone: { type: "number", default: 0.18 },
          },
          tick: function (time, timeDelta) {
            const scene = this.el.sceneEl;
            if (!scene?.is("vr-mode")) return;

            const rig = document.getElementById("rig");
            const cam = document.getElementById("camera");
            if (!rig || !cam) return;

            const gamepad =
              this.el.components["tracked-controls"]?.controller?.gamepad;
            if (!gamepad?.axes) return;

            // Joystick-Achsen auslesen (mit Fallback für verschiedene Controller)
            let joystickX = gamepad.axes[2] ?? gamepad.axes[0] ?? 0;
            let joystickY = gamepad.axes[3] ?? gamepad.axes[1] ?? 0;

            // Deadzone: Kleine Inputs ignorieren um Drift zu vermeiden
            if (Math.abs(joystickX) < this.data.deadzone) joystickX = 0;
            if (Math.abs(joystickY) < this.data.deadzone) joystickY = 0;
            if (joystickX === 0 && joystickY === 0) return;

            const dt = timeDelta / 1000;
            const cameraRotation = cam.getAttribute("rotation").y;
            const yaw = (cameraRotation * Math.PI) / 180;

            // Berechne Bewegung relativ zur Blickrichtung
            const forward = joystickY * this.data.speed * dt;
            const strafe = joystickX * this.data.speed * dt;

            const moveX = Math.sin(yaw) * forward + Math.cos(yaw) * strafe;
            const moveZ = Math.cos(yaw) * forward - Math.sin(yaw) * strafe;

            const pos = rig.getAttribute("position");
            rig.setAttribute("position", {
              x: pos.x + moveX,
              y: pos.y,
              z: pos.z + moveZ,
            });
          },
        });

        /**
         * VR Höhen-Bewegungs-Komponente
         * Der rechte Joystick bewegt den Spieler nach oben/unten.
         * Dies ermöglicht eine freie Bewegung in 3D-Raum.
         */
        AFRAME.registerComponent("vr-vertical-move", {
          schema: {
            speed: { type: "number", default: 1.2 },
            deadzone: { type: "number", default: 0.18 },
          },
          tick: function (time, timeDelta) {
            const scene = this.el.sceneEl;
            if (!scene?.is("vr-mode")) return;

            const rig = document.getElementById("rig");
            if (!rig) return;

            const gamepad =
              this.el.components["tracked-controls"]?.controller?.gamepad;
            if (!gamepad?.axes) return;

            // Rechter Joystick Y-Achse für Auf/Ab Bewegung
            const verticalInput = gamepad.axes[3] ?? gamepad.axes[1] ?? 0;
            if (Math.abs(verticalInput) < this.data.deadzone) return;

            const dt = timeDelta / 1000;
            const moveUp = -verticalInput * this.data.speed * dt;

            const pos = rig.getAttribute("position");
            rig.setAttribute("position", {
              x: pos.x,
              y: pos.y + moveUp,
              z: pos.z,
            });
          },
        });

        /**
         * Hilfsfunktion: Bewegt den Rig so, dass die HMD-Kamera auf ein Ziel blickt
         * Dies wird verwendet, um den Spieler beim Eintritt in VR vor den Automaten
         * zu platzieren und gleichzeitig die Kamera auf den Automat auszurichten.
         */
        function moveRigSoCameraHitsWorldPos(targetWorldPos, targetYawDeg) {
          const rig = document.getElementById("rig");
          const cam = document.getElementById("camera");
          if (!rig || !cam) return;

          // Hole die aktuelle Welt-Position der Kamera
          const camWorld = new THREE.Vector3();
          cam.object3D.getWorldPosition(camWorld);

          // Berechne die Differenz zwischen Ziel und Kamera
          const delta = targetWorldPos.clone().sub(camWorld);

          // Verschiebe den Rig um diese Differenz
          const rigPos = rig.getAttribute("position");
          rig.setAttribute("position", {
            x: rigPos.x + delta.x,
            y: rigPos.y + delta.y,
            z: rigPos.z + delta.z,
          });

          // Richte den Rig in die gewünschte Richtung
          rig.setAttribute("rotation", { x: 0, y: targetYawDeg, z: 0 });
        }

        /**
         * Platziert den Spieler vor dem Automaten mit Blickrichtung auf ihn
         * Diese Funktion wird beim VR-Start aufgerufen, um einen guten Startpunkt zu schaffen.
         */
        function spawnInFrontOfAutomat() {
          const automaton = document.getElementById("automatModel");
          if (!automaton) return;

          // Hole die Position des Automaten in der Welt
          const automatonPos = new THREE.Vector3();
          automaton.object3D.getWorldPosition(automatonPos);

          // Berechne die Blickrichtung des Automaten
          const automatonForward = new THREE.Vector3(0, 0, -1).applyQuaternion(
            automaton.object3D.quaternion,
          );

          // Positioniere den Spieler 1.2 Einheiten vor dem Automaten
          const spawnDistance = 1.2;
          const spawnPos = automatonPos
            .clone()
            .add(automatonForward.clone().multiplyScalar(spawnDistance));

          // Der Spieler blickt auf den Automaten (180° Drehung)
          const automRot = automaton.getAttribute("rotation");
          const lookAtYaw = (automRot ? automRot.y : 0) + 180;

          moveRigSoCameraHitsWorldPos(spawnPos, lookAtYaw);
        }

        /**
         * XR Setup - Verwaltet VR/AR Modus
         * Hier werden die VR/AR-Buttons konfiguriert und die Modi werden gesteuert.
         * Es wird zwischen VR-Mode und AR-Mode gewechselt und die Positionen werden entsprechend angepasst.
         */
        (function setupXr() {
          const scene = document.querySelector("a-scene");
          const leftController = document.getElementById("leftHand");
          const rightController = document.getElementById("rightHand");
          const rig = document.getElementById("rig");
          const cam = document.getElementById("camera");
          const vrBtn = document.getElementById("vrButton");
          const arBtn = document.getElementById("arButton");

          if (!scene || !rig) return;

          // Prüfe, welche XR-Modi verfügbar sind und zeige Buttons nur wenn unterstützt
          if (navigator.xr) {
            navigator.xr
              .isSessionSupported("immersive-vr")
              .then((supported) => {
                if (supported) vrBtn.classList.add("available");
              });
            navigator.xr
              .isSessionSupported("immersive-ar")
              .then((supported) => {
                if (supported) arBtn.classList.add("available");
              });
          }

          // vr button handling
          vrBtn.addEventListener("click", async () => {
            if (scene.is("vr-mode")) {
              scene.exitVR();
            } else {
              try {
                // VR mit minimalen Features für maximale Kompatibilität
                const session = await navigator.xr.requestSession(
                  "immersive-vr",
                  {
                    requiredFeatures: [],
                    optionalFeatures: ["local-floor", "bounded-floor"],
                  },
                );
                scene.enterVR();
              } catch (error) {
                console.error("VR konnte nicht gestartet werden:", error);
              }
            }
          });

          // ar button handling
          arBtn.addEventListener("click", async () => {
            if (scene.is("ar-mode")) {
              scene.exitAR();
            } else {
              try {
                const session =
                  await navigator.xr.requestSession("immersive-ar");
                scene.enterAR();
              } catch (error) {
                console.error("AR konnte nicht gestartet werden:", error);
                alert("AR nicht verfügbar. Bitte Kamerazugriff erlauben.");
              }
            }
          });

          // Speichern der Desktop-Startposition für den Fall, dass VR/AR beendet wird
          let savedRigPos = null;
          let savedRigRot = null;

          // Aktiviere den Game Loop für alle Modi (Desktop, VR, AR)
          scene.setAttribute("buzzer-game-loop", "");

          scene.addEventListener("enter-vr", () => {
            vrBtn.textContent = "🥽 VR beenden";
            arBtn.style.display = "none";

            // Zeige Controller in VR
            leftController?.setAttribute("visible", "true");
            rightController?.setAttribute("visible", "true");

            // Platziere Spieler vor dem Automaten
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                spawnInFrontOfAutomat();

                // Speichere die VR-Position für späteren Exit
                setTimeout(() => {
                  savedRigPos = { ...rig.getAttribute("position") };
                  savedRigRot = { ...rig.getAttribute("rotation") };
                }, 0);
              });
            });
          });

          // vr end event
          scene.addEventListener("exit-vr", () => {
            vrBtn.textContent = "🥽 VR starten";
            arBtn.style.display = "block";

            // Verstecke Controller
            leftController?.setAttribute("visible", "false");
            rightController?.setAttribute("visible", "false");

            // Rückkehr zur Desktop-Position
            if (savedRigPos && savedRigRot) {
              rig.setAttribute("position", savedRigPos);
              rig.setAttribute("rotation", savedRigRot);
            }

            // Kameradrehung zurücksetzen
            const lookControls = cam?.components?.["look-controls"];
            if (lookControls?.resetOrientation) {
              lookControls.resetOrientation();
            }
            cam?.setAttribute("rotation", "0 0 0");
          });

          // ar start event
          scene.addEventListener("enter-ar", () => {
            arBtn.textContent = "📱 AR beenden";
            vrBtn.style.display = "none";

            // Verstecke Controller in AR (nicht nötig)
            leftController?.setAttribute("visible", "false");
            rightController?.setAttribute("visible", "false");

            // Speichere Desktop-Position vor AR-Wechsel
            savedRigPos = { ...rig.getAttribute("position") };
            savedRigRot = { ...rig.getAttribute("rotation") };

            // Mache Hintergrund transparent für AR
            scene.setAttribute("background", "color: rgba(0, 0, 0, 0)");
            scene.setAttribute(
              "renderer",
              "colorManagement: true; antialias: true;",
            );
          });

          // ar end event
          scene.addEventListener("exit-ar", () => {
            arBtn.textContent = "📱 AR starten";
            vrBtn.style.display = "block";

            // Stelle normalen weißen Hintergrund wieder her
            scene.setAttribute("background", "color: #ffffff");

            // Rückkehr zur Position vor AR
            if (savedRigPos && savedRigRot) {
              rig.setAttribute("position", savedRigPos);
              rig.setAttribute("rotation", savedRigRot);
            }
            cam?.setAttribute("rotation", "0 0 0");

            // Stelle ursprüngliche Skalierung wieder her
            const arcade = document.getElementById("arcade");
            const screenContainer = document.getElementById("screenContainer");
            if (arcade && screenContainer) {
              arcade.setAttribute("scale", "1 1 1");
              screenContainer.setAttribute("scale", "1.75 1.75 1.75");
            }
          });
        })();

        // Spiellogik
        (function initGame() {
          const GAME_DURATION = 30;
          const difficulties = [
            {
              name: "EASY",
              spawnDelayMin: 0.8,
              spawnDelayMax: 1,
              buzzerLifetime: 1.4,
            },
            {
              name: "NORMAL",
              spawnDelayMin: 0.6,
              spawnDelayMax: 0.8,
              buzzerLifetime: 1.0,
            },
            {
              name: "HARD",
              spawnDelayMin: 0.4,
              spawnDelayMax: 0.6,
              buzzerLifetime: 0.7,
            },
          ];

          // variablen
          let currentDifficulty = 1; // normal ist Standard
          let isGameActive = false;
          let remainingTime = GAME_DURATION;
          let playerScore = 0;
          let savedHighscore = 0;
          let bestReactionTime = null;

          // buzzer verwaltung
          let nextBuzzerSpawnTime = 0;
          let activeBuzzer = null;
          let buzzerSpawnedAt = 0;
          let buzzerTimeoutId = null;

          // dom referenzen
          const screenUIContainer = document.getElementById("buzzerContainer");
          const timerDisplay = document.getElementById("timerText");
          const scoreDisplay = document.getElementById("scoreText");
          const highscoreDisplay = document.getElementById("highscoreText");
          const reactionDisplay = document.getElementById("reactionText");
          const screenTextDisplay = document.getElementById("screenText");
          const difficultyLabel = document.getElementById("difficultyLabel");
          const startBtn = document.getElementById("startButton");
          const difficultyBtn = document.getElementById("difficultyButton");
          const resetHighscoreBtn = document.getElementById("resetHighscore");

          // highscore laden
          if (window.localStorage) {
            const stored = localStorage.getItem("buzzerXRHighscore");
            if (stored) {
              savedHighscore = parseInt(stored, 10) || 0;
              highscoreDisplay.setAttribute(
                "value",
                "Highscore: " + savedHighscore,
              );
            }
          }

          // zeit formatieren
          function formatTime(seconds) {
            return "Zeit: " + seconds.toFixed(1);
          }

          function setDifficulty(index) {
            currentDifficulty = index;
            difficultyLabel.setAttribute(
              "value",
              difficulties[currentDifficulty].name,
            );
          }

          function changeDifficulty() {
            if (isGameActive) return;
            currentDifficulty = (currentDifficulty + 1) % difficulties.length;
            setDifficulty(currentDifficulty);
          }

          function deleteHighscore() {
            if (window.localStorage) {
              localStorage.removeItem("buzzerXRHighscore");
            }
            savedHighscore = 0;
            highscoreDisplay.setAttribute("value", "Highscore: 0");
          }

          // refresh funktion für Anzeige
          function refreshUI() {
            const gameInProgress = isGameActive;

            // menü (nicht sichtbar wenn spiel läuft)
            screenTextDisplay.setAttribute("visible", !gameInProgress);
            highscoreDisplay.setAttribute("visible", !gameInProgress);
            reactionDisplay.setAttribute("visible", !gameInProgress);
            startBtn.setAttribute("visible", !gameInProgress);
            document
              .getElementById("startLabel")
              .setAttribute("visible", !gameInProgress);
            resetHighscoreBtn.setAttribute("visible", !gameInProgress);
            document
              .getElementById("resetLabel")
              .setAttribute("visible", !gameInProgress);
            difficultyBtn.setAttribute("visible", !gameInProgress);
            difficultyLabel.setAttribute("visible", !gameInProgress);

            // hud (sichtbar während spiel läuft)
            timerDisplay.setAttribute("visible", gameInProgress);
            scoreDisplay.setAttribute("visible", gameInProgress);

            // texte aktualisieren
            timerDisplay.setAttribute("value", formatTime(remainingTime));
            scoreDisplay.setAttribute(
              "value",
              "Score: " + Math.round(playerScore),
            );
            highscoreDisplay.setAttribute(
              "value",
              "Highscore: " + savedHighscore,
            );

            if (bestReactionTime == null) {
              reactionDisplay.setAttribute("value", "Reaktion: -- ms");
            } else {
              reactionDisplay.setAttribute(
                "value",
                "Reaktion: " + Math.round(bestReactionTime) + " ms",
              );
            }
          }

          // entfernt den aktuellen buzzer aus dem spiel
          function removeBuzzer(missed = false) {
            if (!activeBuzzer) return;

            if (buzzerTimeoutId) {
              clearTimeout(buzzerTimeoutId);
              buzzerTimeoutId = null;
            }

            if (missed) {
              // Verfärbung wenn verpasst
              activeBuzzer.setAttribute("material", "color: #ff8800");
              setTimeout(() => {
                if (activeBuzzer?.parentNode) {
                  activeBuzzer.parentNode.removeChild(activeBuzzer);
                }
                activeBuzzer = null;
              }, 150);
            } else {
              // Sofort entfernen wenn geklickt
              if (activeBuzzer.parentNode) {
                activeBuzzer.parentNode.removeChild(activeBuzzer);
              }
              activeBuzzer = null;
            }
          }

          function spawnBuzzer() {
            if (!isGameActive || activeBuzzer) return;

            const difficulty = difficulties[currentDifficulty];
            const randomX = (Math.random() - 0.5) * 0.65;
            const randomY = (Math.random() - 0.5) * 0.38;
            const depth = 0.01;

            const buzzer = document.createElement("a-entity");
            buzzer.setAttribute("class", "buzzer clickable");
            buzzer.setAttribute("scale", "0.6 0.6 0.6");
            buzzer.setAttribute(
              "position",
              randomX + " " + randomY + " " + depth,
            );
            buzzer.setAttribute("rotation", "90 0 0");
            buzzer.setAttribute(
              "geometry",
              "primitive: cylinder; radius: 0.08; height: 0.08",
            );
            buzzer.setAttribute("material", "color: #ff0000; shader: flat");

            // Click-Ereignis für korrekte Reaktion
            buzzer.addEventListener("click", () => {
              if (!isGameActive || buzzer !== activeBuzzer) return;

              // Berechne Reaktionszeit
              const reactionTime = performance.now() - buzzerSpawnedAt;

              // punkte: je schneller, desto mehr punkte (basis 10 + bonuspunkte)
              playerScore += Math.max(10, 1500 - reactionTime);
              bestReactionTime =
                bestReactionTime == null
                  ? reactionTime
                  : Math.min(bestReactionTime, reactionTime);

              // Feedback wenn getroffen
              buzzer.setAttribute("material", "color: #00ff00");
              buzzer.setAttribute(
                "animation__hit",
                "property: scale; from: 1 1 1; to: 1.4 1.4 1.4; dur: 180",
              );

              setTimeout(() => removeBuzzer(false), 180);
              refreshUI();
              scheduleNextBuzzer();
            });

            screenUIContainer.appendChild(buzzer);
            activeBuzzer = buzzer;
            buzzerSpawnedAt = performance.now();

            // entfernen wenn buzzer verpasst
            buzzerTimeoutId = setTimeout(() => {
              if (!isGameActive || !activeBuzzer || activeBuzzer !== buzzer)
                return;
              removeBuzzer(true);
              scheduleNextBuzzer();
            }, difficulty.buzzerLifetime * 1000);
          }

          // plant den zeitpunkt für den nächsten buzzer
          function scheduleNextBuzzer() {
            const difficulty = difficulties[currentDifficulty];
            const delay =
              difficulty.spawnDelayMin +
              Math.random() *
                (difficulty.spawnDelayMax - difficulty.spawnDelayMin);
            nextBuzzerSpawnTime = performance.now() + delay * 1000;
          }

          function startNewGame() {
            if (isGameActive) return;

            isGameActive = true;
            remainingTime = GAME_DURATION;
            playerScore = 0;
            bestReactionTime = null;

            document.getElementById("audioStart").play();
            refreshUI();
            scheduleNextBuzzer();
          }

          function endCurrentGame() {
            isGameActive = false;
            removeBuzzer(false);

            // neuer highscore
            if (playerScore > savedHighscore) {
              savedHighscore = Math.round(playerScore);
              if (window.localStorage) {
                localStorage.setItem("buzzerXRHighscore", savedHighscore);
              }
            }

            refreshUI();

            // zeige endergebnis auf dem bildschirm
            screenTextDisplay.setAttribute(
              "value",
              "GAME OVER\nScore: " +
                Math.round(playerScore) +
                "\nBeste Reaktion: " +
                (bestReactionTime == null
                  ? "--"
                  : Math.round(bestReactionTime) + " ms") +
                "\nHighscore: " +
                savedHighscore +
                "\nDruecke START fuer neue Runde",
            );
          }

          // deltaTime in sekunden, Zeit seit letztem Frame
          function gameLoop(deltaTime) {
            if (!isGameActive) return;

            remainingTime -= deltaTime;

            if (remainingTime <= 0) {
              remainingTime = 0;
              endCurrentGame();
              return;
            }

            refreshUI();

            // Spawne neuen Buzzer wenn Zeit ist vorbei
            if (!activeBuzzer && performance.now() >= nextBuzzerSpawnTime) {
              spawnBuzzer();
            }
          }

          // button events
          window.__buzzerTick = gameLoop;
          startBtn.addEventListener("click", () => startNewGame());
          difficultyBtn.addEventListener("click", () => changeDifficulty());
          resetHighscoreBtn.addEventListener("click", () => deleteHighscore());

          setDifficulty(currentDifficulty);
          refreshUI();
        })();
      </script>
    </a-scene>
  </body>
</html>
